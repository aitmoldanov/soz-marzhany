<!DOCTYPE html>
<html lang="kk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Söz Marzhany Qazyna</title>
    <style>
      :root {
        --bg: #f5f1e8;
        --panel: #fffdf8;
        --primary: #0e5b4c;
        --primary-dark: #0a4339;
        --accent: #d89b2d;
        --text: #1f2a2a;
        --muted: #5f6d6d;
        --line: rgba(14, 91, 76, 0.18);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(180deg, #eef7f3 0%, var(--bg) 100%);
        color: var(--text);
      }

      .container {
        max-width: 1100px;
        margin: 0 auto;
        padding: 40px 20px 80px;
      }

      .hero {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 24px;
        box-shadow: 0 18px 40px rgba(15, 35, 31, 0.08);
        padding: 48px 32px;
        display: grid;
        grid-template-columns: 1.2fr 0.8fr;
        gap: 28px;
        align-items: center;
      }

      .eyebrow {
        display: inline-block;
        background: rgba(216, 155, 45, 0.12);
        color: var(--primary-dark);
        border: 1px solid rgba(216, 155, 45, 0.2);
        padding: 8px 12px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 18px 0 14px;
        font-size: clamp(2.4rem, 6vw, 4rem);
        line-height: 1.08;
        color: var(--primary-dark);
      }

      p {
        margin: 0;
        font-size: 1.08rem;
        line-height: 1.7;
        color: var(--muted);
      }

      .actions {
        margin-top: 28px;
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
      }

      .btn {
        display: inline-block;
        padding: 14px 22px;
        border-radius: 12px;
        text-decoration: none;
        font-weight: 700;
        transition: transform 0.2s ease, opacity 0.2s ease;
      }

      .btn:hover { transform: translateY(-1px); }

      .btn-primary {
        background: var(--primary);
        color: white;
      }

      .btn-secondary {
        background: transparent;
        border: 1px solid var(--line);
        color: var(--primary-dark);
      }

      .card {
        background: linear-gradient(135deg, #eaf6f2 0%, #fefaf0 100%);
        border: 1px solid var(--line);
        border-radius: 22px;
        min-height: 300px;
        display: grid;
        place-items: center;
        padding: 28px;
      }

      .mini-illustration {
        width: 100%;
        max-width: 300px;
        aspect-ratio: 1;
        border-radius: 24px;
        background: radial-gradient(circle at top, #f7f0d7 0%, #dfeee8 38%, #b9d9d0 100%);
        position: relative;
        border: 1px solid rgba(14, 91, 76, 0.08);
      }

      .mini-illustration::before,
      .mini-illustration::after {
        content: "";
        position: absolute;
        border-radius: 18px;
        background: rgba(14, 91, 76, 0.08);
      }

      .mini-illustration::before {
        width: 68%;
        height: 52%;
        left: 16%;
        top: 22%;
        box-shadow: inset 0 0 0 8px rgba(14, 91, 76, 0.08);
      }

      .mini-illustration::after {
        width: 42%;
        height: 18%;
        left: 29%;
        bottom: 18%;
        background: rgba(216, 155, 45, 0.35);
      }

      .stats {
        margin-top: 34px;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px;
      }

      .stat {
        padding: 22px 18px;
        background: rgba(255,255,255,0.65);
        border: 1px solid var(--line);
        border-radius: 18px;
      }

      .stat strong {
        display: block;
        font-size: 1.8rem;
        color: var(--primary-dark);
        margin-bottom: 6px;
      }

      .stat span {
        color: var(--muted);
        font-size: 0.95rem;
      }

      @media (max-width: 780px) {
        .hero {
          grid-template-columns: 1fr;
          padding: 28px 20px;
        }

        .stats {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <section class="hero">
        <div>
          <span class="eyebrow">Live project</span>
          <h1>Söz Marzhany Qazyna</h1>
          <p>
            An elegant digital space for language, knowledge, and discovery. This page is
            prepared as a polished landing page for the project and is ready to be served through
            GitHub Pages.
          </p>
          <div class="actions">
            <a class="btn btn-primary" href="#">Explore</a>
            <a class="btn btn-secondary" href="#">Learn more</a>
          </div>
        </div>

        <div class="card">
          <div class="mini-illustration" aria-label="Project illustration"></div>
        </div>
      </section>

      <section class="stats">
        <div class="stat">
          <strong>1</strong>
          <span>Landing page ready</span>
        </div>
        <div class="stat">
          <strong>GitHub</strong>
          <span>Pages supported</span>
        </div>
        <div class="stat">
          <strong>Live</strong>
          <span>Ready to publish</span>
        </div>
      </section>
    </div>
  </body>
</html>
