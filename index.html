<!doctype html>
<html lang="kk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fffdf7">
  <title>Сөз маржаны – ой қазынасы</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #fffdf7; --white: #fff; --ink: #264653; --muted: #71817a;
      --mint: #2a9d8f; --mint-pale: #e6f5f0; --gold: #f4a261; --gold-pale: #fff0dc;
      --coral: #e7765e; --line: #e5e9dd; --shadow: 0 14px 36px #26465312;
      --round: 20px; font-family: "Trebuchet MS", "Nunito", system-ui, sans-serif;
      color: var(--ink); background: var(--paper);
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; min-height: 100vh; background: radial-gradient(ellipse at 2% 12%, #f5e8ce55 0 2px, transparent 3px), radial-gradient(ellipse at 98% 86%, #d7eee355 0 2px, transparent 3px), var(--paper); background-size: 34px 34px, 42px 42px, auto; font-size: 18px; }
    button, input, textarea { font: inherit; }
    button { color: inherit; }
    button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid #e6a544; outline-offset: 3px; }
    .topbar { position: sticky; z-index: 10; top: 0; background: #fffdf7ee; backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
    .top-inner { max-width: 1240px; min-height: 72px; margin: auto; padding: 10px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .brand { display: flex; align-items: center; gap: 11px; font-weight: 900; line-height: 1.15; }
    .brand-mark { width: 43px; height: 43px; display: grid; place-items: center; border-radius: 15px 15px 15px 5px; background: var(--mint); color: white; font-size: 24px; }
    .brand span { display: block; color: var(--mint); }
    .top-actions, .grade-switch, .nav, .button-row, .task-nav, .swatches { display: flex; align-items: center; gap: 8px; }
    .grade-switch { padding: 4px; background: #edf0e7; border-radius: 13px; }
    .grade-switch button { border: 0; border-radius: 10px; padding: 9px 12px; background: transparent; color: var(--muted); font-weight: 900; cursor: pointer; }
    .grade-switch button.active { background: white; color: var(--ink); box-shadow: 0 2px 8px #26465314; }
    .pill { display: flex; align-items: center; gap: 6px; padding: 9px 12px; background: white; border: 1px solid var(--line); border-radius: 12px; font-size: 14px; font-weight: 900; white-space: nowrap; }
    .pearl-pill { position: relative; }
    .pearl-pop { position: absolute; top: -25px; right: 3px; z-index: 20; color: #a76a13; font-size: 15px; font-weight: 900; pointer-events: none; animation: pearlFloat 1.2s ease-out forwards; }
    .pearl-pill.bump { animation: pearlBump .38s ease; }
    @keyframes pearlFloat { 0% { opacity: 0; transform: translateY(8px) scale(.8); } 20% { opacity: 1; } 100% { opacity: 0; transform: translateY(-27px) scale(1.05); } }
    @keyframes pearlBump { 50% { transform: scale(1.12); } }
    .nav-wrap { overflow-x: auto; border-top: 1px solid #e9ebdf; scrollbar-width: none; }
    .nav { width: max-content; min-width: 100%; max-width: 1240px; margin: auto; padding: 0 24px; gap: 3px; }
    .nav button { position: relative; border: 0; padding: 13px 12px 15px; background: transparent; color: #78847e; font-weight: 900; font-size: 13px; white-space: nowrap; cursor: pointer; }
    .nav button.active { color: var(--ink); }
    .nav button.active::after { position: absolute; right: 12px; bottom: 0; left: 12px; height: 3px; border-radius: 4px 4px 0 0; background: var(--mint); content: ""; }
    main { max-width: 1240px; margin: auto; padding: 28px 24px 70px; }
    .view { display: none; animation: appear .28s ease both; }
    .view.active { display: block; }
    @keyframes appear { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 8px; font-size: clamp(29px, 4vw, 43px); line-height: 1.1; }
    h2 { margin-bottom: 7px; font-size: 22px; }
    p { line-height: 1.6; }
    .eyebrow { color: var(--mint); font-weight: 900; font-size: 12px; letter-spacing: .04em; }
    .muted, .page-heading p { color: var(--muted); }
    .page-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; margin: 3px 0 20px; }
    .page-heading p { max-width: 690px; margin: 0; font-size: 16px; }
    .badge { display: inline-flex; align-items: center; gap: 6px; padding: 8px 11px; border-radius: 99px; background: var(--mint-pale); color: #246d62; font-size: 13px; font-weight: 900; white-space: nowrap; }
    .hero { display: grid; grid-template-columns: 1.05fr .95fr; min-height: 300px; overflow: hidden; border-radius: 27px; background: var(--ink); color: white; box-shadow: var(--shadow); }
    .hero-copy { align-self: center; padding: 34px 38px; }
    .hero .eyebrow { color: #ade4d7; }
    .hero h1 { margin-top: 10px; font-size: clamp(35px, 5vw, 54px); }
    .hero p { max-width: 560px; margin: 13px 0 20px; color: #d7e8e1; font-size: 17px; }
    .hero-art { position: relative; display: grid; place-items: center; overflow: hidden; min-height: 280px; background: linear-gradient(145deg, #41a78c, #1d705f); }
    .hero-art::before, .hero-art::after { position: absolute; width: 330px; height: 330px; border: 1px solid #ffffff36; border-radius: 50%; content: ""; }
    .hero-art::after { width: 230px; height: 230px; }
    .hero-book { z-index: 1; font-size: 105px; filter: drop-shadow(0 13px 10px #123b3850); animation: float 3s ease-in-out infinite; }
    .hero-star { position: absolute; top: 24%; right: 23%; font-size: 42px; animation: twinkle 2s ease-in-out infinite; }
    @keyframes float { 50% { transform: translateY(-9px) rotate(2deg); } }
    @keyframes twinkle { 50% { transform: scale(1.2) rotate(12deg); } }
    .button { display: inline-flex; min-height: 44px; align-items: center; justify-content: center; gap: 7px; padding: 10px 16px; border: 0; border-radius: 13px; background: var(--mint); color: white; font-weight: 900; cursor: pointer; transition: transform .2s, filter .2s, background .2s; }
    .button:hover { filter: brightness(.95); transform: translateY(-2px); }
    .button:active, .tile:active { transform: scale(.96); }
    .button.gold { background: var(--gold); color: #513916; }
    .button.soft { background: var(--mint-pale); color: var(--ink); }
    .button.outline { border: 1px solid var(--line); background: white; color: var(--ink); }
    .button.danger { background: #fff0e9; color: #944b3e; }
    .button.small { min-height: 36px; padding: 7px 11px; font-size: 13px; }
    .button:disabled { opacity: .55; cursor: not-allowed; transform: none; }
    .home-strip { margin: 25px 0 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .home-strip h2 { margin: 0; }
    .module-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .module-card, .panel, .tile { border: 1px solid var(--line); border-radius: var(--round); background: #ffffffeb; box-shadow: 0 8px 24px #26465308; backdrop-filter: blur(10px); }
    .module-card { position: relative; min-height: 156px; padding: 18px; cursor: pointer; text-align: left; transition: transform .2s, box-shadow .2s; }
    .module-card:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
    .module-icon { display: grid; width: 42px; height: 42px; margin-bottom: 12px; place-items: center; border-radius: 14px; background: var(--mint-pale); font-size: 23px; }
    .module-card:nth-child(2) .module-icon, .module-card:nth-child(5) .module-icon { background: var(--gold-pale); }
    .module-card strong, .module-card small { display: block; }
    .module-card strong { margin-bottom: 5px; font-size: 17px; }
    .module-card small { max-width: 260px; color: var(--muted); font-size: 13px; line-height: 1.45; }
    .module-arrow { position: absolute; top: 19px; right: 18px; color: var(--mint); font-size: 20px; }
    .panel { padding: 21px; }
    .task-controls { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 15px; padding: 12px 15px; border: 1px solid var(--line); border-radius: 16px; background: #ffffffd9; }
    .task-controls small { color: var(--muted); }
    .task-nav { flex-wrap: wrap; justify-content: flex-end; }
    .task-dots { display: flex; flex-wrap: wrap; gap: 4px; max-width: 450px; }
    .task-dot { width: 10px; height: 10px; padding: 0; border: 0; border-radius: 50%; background: #dce5df; cursor: pointer; }
    .task-dot.active { background: var(--mint); transform: scale(1.3); }
    .task-dot.done { background: var(--gold); }
    .task-step { min-width: 38px; height: 36px; border: 1px solid var(--line); border-radius: 10px; background: white; font-weight: 900; cursor: pointer; }
    .task-card { display: grid; grid-template-columns: minmax(0, 1fr) 270px; gap: 18px; }
    .task-main { min-height: 320px; }
    .task-prompt { margin: 9px 0 17px; font-size: clamp(21px, 3vw, 27px); font-weight: 900; line-height: 1.35; }
    .task-cue { display: grid; min-height: 95px; margin: 12px 0; place-items: center; color: var(--ink); font-size: clamp(45px, 8vw, 74px); }
    .choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
    .choice { min-height: 54px; padding: 11px 14px; border: 2px solid var(--line); border-radius: 14px; background: white; cursor: pointer; font-size: 18px; font-weight: 900; text-align: left; transition: .18s ease; }
    .choice:hover { border-color: #9dcfc1; background: #f5fbf8; transform: translateY(-1px); }
    .choice.correct { border-color: #67b28e; background: #eaf7ed; }
    .choice.incorrect { border-color: #e5a18e; background: #fff0e9; }
    .choice:disabled { cursor: default; }
    .feedback { min-height: 26px; margin: 13px 0 0; color: #287459; font-weight: 900; }
    .reward-panel { display: flex; flex-direction: column; justify-content: space-between; padding: 19px; border-radius: 17px; background: var(--mint-pale); }
    .reward-panel .big { margin: 3px 0; color: var(--mint); font-size: 36px; font-weight: 900; }
    .progress-track { height: 9px; overflow: hidden; border-radius: 99px; background: #d9e7df; }
    .progress-track span { display: block; height: 100%; border-radius: inherit; background: var(--mint); transition: width .3s; }
    .story-text, .value-text { padding: 15px; border-radius: 15px; background: #fff9e9; font-size: 19px; line-height: 1.7; }
    .story-steps { display: grid; gap: 8px; margin: 14px 0; }
    .story-step { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 13px; background: white; }
    .story-step .step-text { flex: 1; font-weight: 800; }
    .step-number { display: grid; width: 31px; height: 31px; flex: 0 0 auto; place-items: center; border-radius: 10px; background: var(--mint-pale); color: #246d62; font-weight: 900; }
    .sequence-cue { display: grid; width: 40px; height: 40px; flex: 0 0 auto; place-items: center; border-radius: 12px; background: var(--gold-pale); font-size: 23px; }
    .move-buttons { display: flex; gap: 4px; }
    .move-buttons button { width: 34px; height: 34px; border: 1px solid var(--line); border-radius: 9px; background: white; font-weight: 900; cursor: pointer; }
    .writing-area { width: 100%; min-height: 140px; padding: 12px; resize: vertical; border: 1px solid var(--line); border-radius: 13px; background: #fff; color: #264653; -webkit-text-fill-color: #264653; line-height: 1.6; }
    .writing-area::placeholder { color: #82918b; opacity: 1; }
    .writing-area:focus { background: #fff; color: #264653; }
    .form-input, .name-input { color: #264653; -webkit-text-fill-color: #264653; }
    .form-input::placeholder, .name-input::placeholder { color: #82918b; opacity: 1; }
    .connector { border: 0; border-radius: 99px; padding: 7px 10px; background: var(--gold-pale); font-weight: 900; cursor: pointer; }
    .canvas-layout { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 16px; }
    .canvas-wrap { overflow: hidden; border: 1px solid #e5e8dc; border-radius: 15px; background: #fffefa; }
    #writingCanvas { display: block; width: 100%; height: 310px; touch-action: none; cursor: crosshair; }
    .tool-group { margin: 15px 0; }
    .tool-label { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 13px; font-weight: 900; }
    input[type="range"] { width: 100%; accent-color: var(--mint); }
    .swatch { width: 29px; height: 29px; border: 3px solid white; border-radius: 50%; box-shadow: 0 0 0 1px var(--line); cursor: pointer; }
    .swatch.active { box-shadow: 0 0 0 3px var(--gold); }
    .values-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 15px; }
    .value-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 7px; align-content: start; }
    .value-tab { min-height: 42px; padding: 8px; border: 1px solid var(--line); border-radius: 11px; background: white; cursor: pointer; font-size: 13px; font-weight: 900; text-align: left; }
    .value-tab.active { border-color: var(--mint); background: var(--mint-pale); }
    .value-text { margin: 12px 0; }
    .achievement-list, .log-list, .reward-list { display: grid; gap: 10px; }
    .achievement-row, .log-row, .reward-row { display: flex; align-items: center; gap: 12px; padding: 12px; border: 1px solid var(--line); border-radius: 13px; background: white; }
    .achievement-row > div, .log-row > div, .reward-row > div { flex: 1; }
    .achievement-icon { display: grid; width: 40px; height: 40px; place-items: center; border-radius: 12px; background: var(--gold-pale); font-size: 21px; }
    .achievement-row small, .log-row small, .reward-row small { display: block; margin-top: 3px; color: var(--muted); }
    .meter { height: 8px; margin-top: 7px; overflow: hidden; border-radius: 99px; background: #edf0e8; }
    .meter span { display: block; height: 100%; border-radius: inherit; background: var(--mint); }
    .split { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 15px; }
    .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin-bottom: 18px; }
    .stat-box { padding: 14px; border-radius: 14px; background: #f3f8f3; }
    .stat-box strong { display: block; font-size: 25px; }
    .stat-box small { color: var(--muted); }
    .certificate { padding: 28px 20px; border: 3px double #d3b35f; border-radius: 17px; background: #fff9e4; text-align: center; }
    .certificate .award-icon { font-size: 36px; }
    .certificate h2 { color: #9d7421; }
    .name-input, .form-input { width: 100%; min-height: 43px; padding: 9px 11px; border: 1px solid var(--line); border-radius: 11px; background: white; }
    .form-row { display: grid; grid-template-columns: 1fr 110px auto; gap: 8px; }
    .helper { position: fixed; z-index: 11; right: 18px; bottom: 16px; display: flex; align-items: flex-end; gap: 8px; max-width: min(320px, calc(100vw - 24px)); }
    .helper-face { width: 54px; height: 54px; flex: 0 0 auto; display: grid; place-items: center; border: 3px solid white; border-radius: 19px 19px 19px 7px; background: var(--gold); box-shadow: var(--shadow); font-size: 29px; animation: float 2.4s ease-in-out infinite; }
    .helper-bubble { padding: 11px 13px; border: 1px solid var(--line); border-radius: 16px 16px 5px 16px; background: #fffffff2; box-shadow: var(--shadow); font-size: 12px; font-weight: 800; line-height: 1.45; }
    .helper-bubble strong { display: block; color: var(--mint); font-size: 13px; }
    .ornament { position: fixed; z-index: -1; color: #2a9d8f22; font-size: 38px; pointer-events: none; animation: float 7s ease-in-out infinite; }
    .ornament.one { top: 23%; left: 2%; }.ornament.two { right: 3%; bottom: 25%; animation-delay: -3s; }
    #confetti { position: fixed; z-index: 30; inset: 0; pointer-events: none; }
    #toast { position: fixed; z-index: 40; right: 20px; bottom: 91px; max-width: min(400px, calc(100vw - 40px)); padding: 12px 16px; border-radius: 13px; background: var(--ink); color: white; box-shadow: var(--shadow); font-weight: 900; opacity: 0; transform: translateY(10px); transition: .22s; pointer-events: none; }
    #toast.show { opacity: 1; transform: translateY(0); }
    .empty { padding: 20px; color: var(--muted); text-align: center; }
    .ornament-border { border: 1px solid #d5bd8b; background-image: repeating-linear-gradient(45deg, transparent 0 10px, #d5bd8b20 10px 12px, transparent 12px 22px); }
    .pearl-pop { animation: pearlDrop .85s cubic-bezier(.2,.8,.25,1) both; }
    @keyframes pearlDrop { 0% { opacity: 0; transform: translateY(-22px) scale(.45); } 65% { opacity: 1; transform: translateY(4px) scale(1.2); } 100% { transform: translateY(0) scale(1); } }
    .notice-list { display: grid; gap: 8px; margin: 12px 0; }
    .notice { display: flex; align-items: center; gap: 10px; padding: 12px; border: 1px solid #e8d39b; border-radius: 14px; background: #fff8df; }
    .notice > span:nth-child(2) { flex: 1; }
    @media print {
      body * { visibility: hidden !important; }
      #printCertificate, #printCertificate * { visibility: visible !important; }
      #printCertificate { position: fixed; inset: 8%; display: grid; align-content: center; border: 4px double #bd983e; background: #fff9e4; }
      #printCertificate button, #printCertificate input { display: none !important; }
    }
    @media (max-width: 760px) {
      .top-inner { align-items: flex-start; flex-wrap: wrap; padding: 10px 14px; }
      .top-actions { flex-wrap: wrap; justify-content: flex-end; }
      main { padding: 20px 14px 85px; }
      .nav { padding: 0 10px; }
      .hero { grid-template-columns: 1fr; }
      .hero-art { min-height: 180px; }
      .module-grid { grid-template-columns: repeat(2, 1fr); }
      .task-card, .canvas-layout, .split { grid-template-columns: 1fr; }
      .reward-panel { min-height: 170px; }
      .values-grid { grid-template-columns: 1fr; }
      .value-list { grid-template-columns: repeat(3, 1fr); }
      .page-heading { align-items: flex-start; flex-direction: column; }
    }
    @media (max-width: 480px) {
      .brand { min-width: auto; font-size: 13px; }
      .brand-mark { width: 37px; height: 37px; }
      .top-actions { gap: 5px; }
      .pill { padding: 8px; font-size: 12px; }
      .grade-switch button { padding: 8px; font-size: 12px; }
      .module-grid { grid-template-columns: 1fr; }
      .module-card { min-height: 130px; }
      .choices { grid-template-columns: 1fr; }
      .task-controls { align-items: flex-start; flex-direction: column; }
      .task-nav { justify-content: flex-start; }
      .value-list { grid-template-columns: repeat(2, 1fr); }
      .stat-grid { grid-template-columns: 1fr; }
      .form-row { grid-template-columns: 1fr 86px; }
      .form-row .button { grid-column: 1 / -1; }
      .helper { right: 8px; bottom: 8px; }
      .helper-bubble { max-width: 220px; }
    }
  </style>
</head>
<body>
  <span class="ornament one" aria-hidden="true">❋</span><span class="ornament two" aria-hidden="true">✦</span>
  <header class="topbar">
    <div class="top-inner">
      <div class="brand"><div class="brand-mark" aria-hidden="true">🏠</div><div>Сөз маржаны<span>ой қазынасы</span></div></div>
      <div class="top-actions">
        <div class="grade-switch" role="group" aria-label="Сыныпты таңдау"><button data-grade="1">1-сынып</button><button data-grade="2">2-сынып</button></div>
        <div class="pill pearl-pill" id="pearlPill" aria-label="Білім маржандары"><span>🦪</span><span id="pearlCount">0</span></div>
        <div class="pill" aria-label="Жұлдыз"><span>⭐</span><span id="starCount">0</span></div>
      </div>
    </div>
    <div class="nav-wrap"><nav class="nav" aria-label="Негізгі мәзір">
      <button class="active" data-view="home">Басты бет</button>
      <button data-view="vocabulary">Сөз сандығы</button>
      <button data-view="story">Ойдан – мәтінге</button>
      <button data-view="calligraphy">Көркем жазу</button>
      <button data-view="values">Құндылықтар & мәтін талдау</button>
      <button data-view="tongue">Тіл ұстартқыш</button>
      <button data-view="rewards">Ой сандығы</button>
      <button data-view="pictures">Сурет бойынша мәтін</button>
      <button data-view="parent">Байғазы порталы</button>
    </nav></div>
  </header>
  <main><div id="app"></div></main>
  <div class="helper" aria-live="polite"><div class="helper-face" aria-hidden="true">🦉</div><div class="helper-bubble" id="helperBubble"><strong>Зерек</strong>Сәлем! Бірге оқуға дайынсың ба?</div></div>
  <div id="toast" role="status" aria-live="polite"></div><canvas id="confetti"></canvas>
  <script>
    (() => {
      "use strict";
      const $ = (selector, root = document) => root.querySelector(selector);
      const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];
      const KEY = "soz-marzhan-grade12-v2";

      const vocab1 = [
        ["👄","Қай буындардан «ана» сөзі шығады?",["а-на","на-а","ба-ла"],"а-на"],
        ["🐟","Суретке сай сөзді тап.",["балық","қала","доп"],"балық"],
        ["🌞","«Ана» сөзінің соңғы дыбысы қандай?",["А","Н","М"],"А"],
        ["🌙","Қай сөз «күн» сөзіне қарама-қарсы?",["түн","таң","жарық"],"түн"],
        ["🐈","Қай сөз артық: мысық, күшік, алма?",["мысық","күшік","алма"],"алма"],

          fields.forEach(el=>el.addEventListener('input',saveAnswers));
          $("#valueFinish").addEventListener('click',()=>{
            const answers=fields.map(el=>el.value.trim());

            if(awardTask('values',index,item.title)){

              fields.forEach(el=>el.readOnly=true);
            }

        }

        const value=buildValues(state.grade)[index],done=isDone("values",index);
        shell("values",index,`<div class="values-grid"><div class="value-list">${buildValues(state.grade).map((item,i)=>`<button class="value-tab ${i===index?"active":""}" data-value="${i}">${item.icon} ${esc(item.category)} · ${i+1}</button>`).join("")}</div><div class="panel task-main"><div class="eyebrow">${value.icon} ${esc(value.category)} · мәтінді оқы</div><div class="value-text">${esc(value.text)}</div><div class="task-prompt">${esc(value.question)}</div><div class="choices"><button class="choice ${done?"correct":""}" data-value-answer="good" ${done?"disabled":""}>${esc(value.good)}</button><button class="choice" data-value-answer="bad" ${done?"disabled":""}>${esc(value.bad)}</button></div><p class="feedback" id="valueFeedback" aria-live="polite">${done?esc(value.tip):""}</p></div></div>`);
        $$(".value-tab").forEach(button=>button.addEventListener("click",()=>setTask("values",Number(button.dataset.value))));

          if(isDone("values",index))return;
          if(button.dataset.valueAnswer==="good"){button.classList.add("correct");$("#valueFeedback").textContent=value.tip;awardTask("values",index,`${value.category} туралы мәтін`);}
          else{button.classList.add("incorrect");$("#valueFeedback").textContent="Мәтінді тағы оқып көр. Қай әрекет мейірімді әрі қауіпсіз?";playTone([230]);}
        }));

      const PICTURE_SUBMIT_URL = "";
      const pictureTasks = [

        {title:"2. Адалдық – асыл қасиет",hint:"Бала не тауып алды? Ол оны кімге беріп тұр?",image:"./images/picture-02.jpg"},

        {title:"5. Үлкенге құрмет",hint:"Қыз әжеге қандай көмек көрсетіп жатыр? Бұл суреттен қандай құндылықты байқайсың?",image:"./images/picture-05.jpg"},
        {title:"6. Табиғатты қорғайық",hint:"Балалар табиғатты қалай қорғап жүр? Сен табиғатты қорғау үшін не істер едің?",image:"./images/picture-06.jpg"},
        {title:"7. Күз мезгілі",hint:"Суреттен күздің қандай белгілерін көріп тұрсың? Құстар мен ауа райы туралы жаз.",image:"./images/picture-07.jpg"},
        {title:"8. Менің досым",hint:"Екі дос не істеп отыр? Олардың көңіл күйі қандай?",image:"./images/picture-08.jpg"},

          <div class="page-heading"><div><div class="eyebrow">🖼️ ШЫҒАРМАШЫЛЫҚ ТАПСЫРМА</div><h1>Сурет бойынша әңгіме құрастыру</h1><p>Суретке қарап, өз ойыңды қазақ тілінде жаз. Жауабыңды мұғалімге жібер.</p></div><span class="badge">${state.grade}-сынып · ${pictureIndex+1}/${pictureTasks.length}</span></div>

              <p id="pictureFeedback" class="feedback" role="status"></p>
            </form>

      const renderRewards = () => {
        const stickerShop=[{id:"star",icon:"🌟",name:"Жарқыраған жұлдыз",price:30},{id:"flower",icon:"🌷",name:"Мейірім гүлі",price:50},{id:"book",icon:"📚",name:"Білім кітабы",price:70},{id:"crown",icon:"👑",name:"Тапқырлық тәжі",price:100}];
        $("#app").innerHTML=`<section class="view active"><div class="page-heading"><div><div class="eyebrow">Маржандар жүйесі</div><h1>Ой сандығы мен марапаттар</h1><p>Тапсырманы дұрыс орындасаң, +10 білім маржаны аласың. Маржандарыңа жапсырма ашып, өз қазынаңды жина!</p></div><span class="badge">🦪 ${state.marjans} маржан · барлығы ${state.totalEarnedMarjans} таптың</span></div><div class="split"><div class="panel"><div class="eyebrow">ЖАПСЫРМА ДҮКЕНІ</div><h2>Маржаныңды таңда</h2><div class="reward-list">${stickerShop.map(item=>{const owned=state.stickers.includes(item.id);return `<div class="reward-row"><span class="achievement-icon">${item.icon}</span><div><strong>${item.name}</strong><small>${item.price} маржан</small></div><button class="button small ${owned?"soft":"gold"}" data-buy-sticker="${item.id}" ${owned||state.marjans<item.price?"disabled":""}>${owned?"Ашылды ✓":"Ашу"}</button></div>`;}).join("")}</div></div><div class="panel"><div class="eyebrow">МЕНІҢ ҚАЗЫНАМ</div><h2>Жиналған жапсырмалар</h2><div class="module-grid">${state.stickers.length?state.stickers.map(id=>{const item=stickerShop.find(sticker=>sticker.id===id);return item?`<div class="tile" style="padding:18px;text-align:center"><div style="font-size:38px">${item.icon}</div><strong>${item.name}</strong></div>`:"";}).join(""):'<p class="empty">Алғашқы жапсырмаңды ашу үшін маржан жина!</p>'}</div><h2 style="margin-top:22px">Ата-ананың байғазы марапаттары</h2><div class="reward-list">${state.parentRewards.length?state.parentRewards.map((reward,i)=>`<div class="reward-row"><div><strong>${esc(reward.name)}</strong><small>${reward.price} маржан${state.claimedRewards.includes(i)?" · Берілді":" · Ата-анаңмен келісіп ал"}</small></div>${state.claimedRewards.includes(i)?'<span class="badge">Рақмет!</span>':`<button class="button small" data-claim="${i}" ${state.marjans<reward.price?"disabled":""}>Маржанға алу</button>`}</div>`).join(""):'<p class="muted">Ата-ана марапат қосқанда осында көрінеді.</p>'}</div></div></div></section>`;
        $$("[data-buy-sticker]").forEach(button=>button.addEventListener("click",()=>{const item=stickerShop.find(sticker=>sticker.id===button.dataset.buySticker);if(!item||state.marjans<item.price)return;state.marjans-=item.price;state.stickers.push(item.id);saveState();playTone([720,960]);renderRewards();toast(`${item.name} ашылды!`);}));
        $$("[data-claim]").forEach(button=>button.addEventListener("click",()=>{const i=Number(button.dataset.claim),reward=state.parentRewards[i];if(!reward||state.marjans<reward.price)return;if(!confirm(`«${reward.name}» марапатын ${reward.price} маржанға белгілейсің бе?`))return;state.marjans-=reward.price;state.claimedRewards.push(i);state.baygazyHistory.unshift({title:"Байғазы марапаты",detail:reward.name,score:`${reward.price} маржан`});saveState();renderRewards();}));

l>${reward.price} маржан · ${state.claimedRewards.includes(i)?"орындалды":"орындалмаған"}</small></div></div>`).join(""):'<p class="empty">Әзірше марапат қосылмаған.</p>'}</div></div></div><div class="split" style="margin-top:15px"><div class="panel"><div class="eyebrow">БАЙҒАЗЫ МАРЖАНЫ</div><h2>Қолдау білдіріңіз</h2><form id="bonusForm" class="form-row"><input class="form-input" name="marjans" type="number" min="1" max="5000" step="1" placeholder="Маржан саны" required><input class="form-input" name="message" maxlength="100" placeholder="«Жарайсың, балам!»"><button class="button gold" type="submit">Бонус жіберу</button></form></div><div class="panel"><div class="eyebrow">СОҢҒЫ ӘРЕКЕТ</div><h2>Оқу белсенділігі</h2><div class="log-list">${state.activity.length?state.activity.slice(0,5).map(item=>`<div class="log-row"><div><strong>${esc(item.title)}</strong><small>${esc(item.detail)}</small></div><span class="badge">${esc(item.score)}</span></div>`).join(""):'<p class="empty">Әзірше белсенділік жоқ.</p>'}</div></div></div><div class="panel" style="margin-top:15px"><div class="eyebrow">МАРАПАТ ҚАҒАЗЫ</div><div class="certificate" id="printCertificate"><div class="award-icon">🏅</div><p class="eyebrow">ҚҰТТЫҚТАЙМЫЗ!</p><h2>Аптаның үздік әңгімешісі</h2><p>Қызыға оқып, әдемі әңгіме құрастырғаны үшін беріледі.</p><input class="name-input" id="studentName" value="${esc(state.studentName)}" placeholder="Оқушының аты-жөні" aria-label="Оқушының аты-жөні"><p><strong id="certificateName">${esc(state.studentName||"Жарайсың!")}</strong></p><button class="button gold" id="printButton">Басып шығару ⎙</button></div></div></section>`;
        $("#printCertificate").parentElement.insertAdjacentHTML("beforebegin",`<div class="panel ornament-border" style="margin-top:15px"><div class="eyebrow">СҮЙІНШІ · АЛҒЫС ХАТ</div><h2>Оқушыға қолдау белгісін жіберіңіз</h2><p class="muted">Ата-ана не мұғалім баланың басты бетіне жылы сөз жібере алады.</p><form id="encouragementForm" class="form-row"><select class="form-input" name="badge" aria-label="Қолдау белгісі"><option>Сүйінші!</option><option>Алғыс хат</option><option>Бәрекелді!</option></select><input class="form-input" name="message" maxlength="100" placeholder="Жарайсың! Сенің қолыңнан келеді."><button class="button gold" type="submit">Жіберу ✨</button></form><h3 style="margin-top:18px">Байғазы тарихы</h3><div class="log-list">${state.baygazyHistory.length?state.baygazyHistory.slice(0,5).map(item=>`<div class="log-row"><div><strong>${esc(item.title)}</strong><small>${esc(item.detail)}</small></div><span class="badge">${esc(item.score)}</span></div>`).join(""):'<p class="empty">Әзірше байғазы берілген жоқ.</p>'}</div></div>`);
        $("#rewardForm").addEventListener("submit",event=>{event.preventDefault();const form=new FormData(event.currentTarget),name=String(form.get("name")).trim(),price=Number(form.get("price"));if(!name||!Number.isFinite(price)||price<10){toast("Марапат атауы мен кемінде 10 маржан енгізіңіз.");return;}state.parentRewards.push({name,price});state.baygazyHistory.unshift({title:"Жаңа байғазы белгіленді",detail:name,score:`${price} маржан`});saveState();renderParent();toast("Байғазы марапаты қосылды.");});
        $("#bonusForm").addEventListener("submit",event=>{event.preventDefault();const form=new FormData(event.currentTarget),marjans=Math.floor(Number(form.get("marjans"))),message=String(form.get("message")||"Жарайсың, балам!").trim();if(!Number.isFinite(marjans)||marjans<1||marjans>5000){toast("1–5000 аралығында маржан санын енгізіңіз.");return;}state.marjans+=marjans;state.totalEarnedMarjans+=marjans;state.parentMessage=message||"Жарайсың, балам!";state.activity.unshift({title:"Ата-анадан сүйінші",detail:state.parentMessage,score:`+${marjans} 🦪`});state.baygazyHistory.unshift({title:"Байғазы маржаны",detail:state.parentMessage,score:`+${marjans} маржан`});state.notifications.unshift({id:Date.now(),badge:"Сүйінші!",message:`${state.parentMessage} +${marjans} маржан!`});state.notifications=state.notifications.slice(0,10);state.activity=state.activity.slice(0,20);saveState();playTone([560,740,980]);navigate("home");showPearlReward(marjans);toast(`Ата-анаңнан сүйінші: ${state.parentMessage} +${marjans} маржан!`);});
        $("#encouragementForm").addEventListener("submit",event=>{event.preventDefault();const form=new FormData(event.currentTarget),badge=String(form.get("badge")),message=String(form.get("message")||"Жарайсың! Сенің қолыңнан келеді.").trim()||"Жарайсың! Сенің қолыңнан келеді.";state.encouragements.unshift({badge,message,date:new Date().toLocaleDateString("kk-KZ")});state.notifications.unshift({id:Date.now(),badge,message});state.notifications=state.notifications.slice(0,10);state.baygazyHistory.unshift({title:badge,detail:message,score:"Қолдау"});saveState();playTone([660,880,1040]);navigate("home");toast(`${badge} ${message}`);});
        $("#studentName").addEventListener("input",event=>{state.studentName=event.target.value;saveState();$("#certificateName").textContent=state.studentName||"Жарайсың!";});
        $("#printButton").addEventListener("click",()=>window.print());
      };
      const renderHomeStats = () => {
        updateHeader();
      };
      const renderModuleProgress = () => {
        const overall=Object.keys(modules).reduce((sum,key)=>sum+completedCount(key),0);
        return `<div class="stat-grid"><div class="stat-box"><strong>🦪 ${state.marjans}</strong><small>білім маржаны</small></div><div class="stat-box"><strong>⭐ ${state.stars}</strong><small>жұлдыз</small></div><div class="stat-box"><strong>${overall}/${Object.keys(modules).reduce((sum,key)=>sum+taskCount(key),0)}</strong><small>тапсырма</small></div></div>`;
      };
      const navigate = view => {
        activeView=view; $$(".nav button").forEach(button=>button.classList.toggle("active",button.dataset.view===view));
        if(view==="home")renderHome();
        else if(modules[view])renderModule(view);
        else if(view==="rewards")renderRewards();
        else if(view==="pictures")renderPictures();
        else if(view==="parent")renderParent();
        updateMascot(); window.scrollTo({top:0,behavior:"smooth"});
      };
      const wireGoButtons = () => $$("[data-go]").forEach(button=>button.addEventListener("click",()=>navigate(button.dataset.go)));
      $$(".nav button").forEach(button=>button.addEventListener("click",()=>navigate(button.dataset.view)));
      $$("[data-grade]").forEach(button=>button.addEventListener("click",()=>{
        const grade=Number(button.dataset.grade);if(state.grade===grade)return;state.grade=grade;taskIndex=Object.fromEntries(Object.keys(modules).map(key=>[key,0]));taskStartedAt=Date.now();saveState();navigate(activeView);toast(`${grade}-сыныпқа арналған тапсырмалар дайын!`);
      }));
      window.addEventListener("resize",()=>{if(activeView==="calligraphy"&&$("#writingCanvas"))renderCalligraphy(taskIndex.calligraphy);});
      renderHome();renderHomeStats();updateMascot();
    })();
  </script>
</body>
</html>
